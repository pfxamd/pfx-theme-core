name: Browser compatibility

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "examples/**"
      - "tests/fixtures/**"
      - "scripts/browser-tests.mjs"
      - ".github/workflows/browser.yml"
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "tests/fixtures/**"
      - "scripts/browser-tests.mjs"
      - ".github/workflows/browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Resolve deterministic core version
        run: node .pfx/release.mjs --sync
      - name: Install test runner (CI-only)
        run: npm install --no-save --package-lock=false playwright@1.56.0
      - name: Install browser and Linux libraries
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise appearance core in real browser
        env:
          PFX_BROWSER: ${{ matrix.browser }}
        run: npm run test:browser
      - name: Upload real screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfx-theme-${{ matrix.browser }}-qa
          path: browser-artifacts/${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14
